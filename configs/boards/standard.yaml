# 标准棋盘配置（12×5）
# Junqi Engine 默认棋盘规格

rows: 12
cols: 5
total_cells: 60

# 棋子配置（双方各 25 子）
piece_composition:
  SI: 1       # 司令
  JUN: 1      # 军长
  SHI: 2      # 师长
  LV: 2       # 旅长
  TUAN: 2     # 团长
  YING: 2     # 营长
  LIAN: 3     # 连长
  PAI: 3      # 排长
  GONG: 3     # 工兵
  ZHA: 2      # 炸弹
  LEI: 3      # 地雷
  QI: 1       # 军旗

# 特殊区域坐标
camps:
  - [2, 1]
  - [2, 3]
  - [3, 2]
  - [4, 1]
  - [4, 3]
  - [7, 1]
  - [7, 3]
  - [8, 2]
  - [9, 1]
  - [9, 3]

hq_s:
  - [0, 1]
  - [0, 3]
  - [11, 1]
  - [11, 3]

rail_rows: [1, 5, 6, 10]
rail_cols: [0, 4]

cross_blocked:
  - [[5, 1], [6, 1]]
  - [[5, 2], [6, 2]]
  - [[5, 3], [6, 3]]
