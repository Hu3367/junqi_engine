# 紧凑棋盘配置（6×6）
# 用于快速训练验证和课程学习

rows: 6
cols: 6
total_cells: 36

# 棋子配置（按比例缩减，双方各约 20 子）
piece_composition:
  SI: 1       # 司令
  JUN: 1      # 军长
  SHI: 1      # 师长
  LV: 1       # 旅长
  TUAN: 1     # 团长
  YING: 1     # 营长
  LIAN: 2     # 连长
  PAI: 1      # 排长
  GONG: 2     # 工兵
  ZHA: 1      # 炸弹
  LEI: 2      # 地雷
  QI: 1       # 军旗

# 特殊区域坐标（对称分布）
camps:
  - [1, 2]
  - [1, 3]
  - [2, 1]
  - [2, 4]
  - [3, 0]
  - [3, 5]
  - [4, 1]
  - [4, 4]
  - [5, 2]
  - [5, 3]

hq_s:
  - [0, 2]
  - [0, 3]
  - [5, 2]
  - [5, 3]

rail_rows: [1, 4]
rail_cols: [0, 5]

cross_blocked: []  # 小棋盘简化规则，不设前线阻断
