# 军棋翻棋规则配置
# 根据 APK 解包结果对齐（junqi/config.py RuleConfig）

flag_needs_mines_cleared: true   # 需先清光 3 雷才能扛旗
flag_needs_all_flipped: false    # 场上所有棋子翻开后才能吃军旗
flag_gong_only: true             # 只有工兵能吃军旗（App 默认档）

allow_suicide_attack: false      # 允许小子撞大子（App 实测：不允许）
hq_locks_pieces: false           # 大本营锁死棋子（翻棋模式为 false）

engineer_rail_turns: true        # 工兵铁路可任意转弯
engineer_can_fly_over_pieces: false  # 工兵不可越过轨道上的棋子

no_capture_draw_plies: 70        # 连续 70 步未吃子判和（APK 官方规则）
max_plies: 1000                  # 总步数 1000 判和
repetition_draw_count: 3         # 相同局面出现 3 次判和
